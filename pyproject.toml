[project]
name = "medical-triage-mlops"
version = "0.1.0"
description = "Medical report urgency classification API with CI/CD, monitoring, orchestration, and optimized inference"
readme = "README.md"
authors = [
    { name = "Diego Skieresz", email = "diegoskieresz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "joblib>=1.5.3",
    "numpy>=2.5.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.20.0",
]

[project.scripts]
medical-triage-mlops = "medical_triage_mlops:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]