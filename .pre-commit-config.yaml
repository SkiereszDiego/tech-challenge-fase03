repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types_or: [python, pyi]

      - id: pytest
        name: Pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
